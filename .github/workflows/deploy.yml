# Publishes the game to GitHub Pages (https://mdayv261.github.io/WW1-DawnPatrol/) on every push
# to main: install, run the tests, build, upload the build, deploy. A failing test stops the
# deployment, so a broken version is never published.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
